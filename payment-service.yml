server:
  port: 9020

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-payment-db
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 3000
          vault-service:
            connectTimeout: 2000
            readTimeout: 5000
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 75
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      merchant-service:
        baseConfig: default
      vault-service:
        baseConfig: default
        failureRateThreshold: 40

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      merchant-service:
        baseConfig: default
        maxAttempts: 3
      vault-service:
        baseConfig: default
        maxAttempts: 2
