server:
  port: 9030

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-operations-db
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 3000
          payment-service:
            connectTimeout: 2000
            readTimeout: 5000

            
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 75
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        ignoreExceptions:
          - com.paymentgatewayproject.razorpay.common_lib.exception.BusinessValidationException
    instances:
      merchant-service:
        baseConfig: default
      payment-service:
        baseConfig: default
        failureRateThreshold: 40

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.paymentgatewayproject.razorpay.common_lib.exception.BusinessValidationException
    instances:
      merchant-service:
        baseConfig: default
        maxAttempts: 3
      payemnt-service:
        baseConfig: default
        maxAttempts: 2

app:
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
